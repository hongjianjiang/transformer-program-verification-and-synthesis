[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "rasp-translation"
version = "0.1.0"
description = "Translation from RASP variants to verifier languages"
readme = "README.md"
authors = ["Matt"]
license = "MIT"
packages = [
    {include = "rasptranslation"}
]

[tool.poetry.dependencies]
python = ">=3.10"
lark = ">=1.3.1"
docopt-ng = ">=0.6.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"

[tool.poetry.scripts]
main = "rasptranslation.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
